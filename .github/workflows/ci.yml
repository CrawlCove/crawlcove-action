name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: summary.js tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  self-test:
    name: Run the action against the fixture site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Serve the fixture site
        run: |
          (cd tests/fixture-site && python3 -m http.server 8080 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/ > /dev/null && break; sleep 0.5; done
          curl -fs http://127.0.0.1:8080/robots.txt

      - name: Report-only crawl (fail-on none) must pass
        id: report_only
        uses: ./
        with:
          url: http://127.0.0.1:8080/
          fail-on: none
          comment: 'false'

      - name: Gated crawl must fail on the planted broken link
        id: gated
        uses: ./
        continue-on-error: true
        with:
          url: http://127.0.0.1:8080/
          fail-on: broken-links
          comment: 'false'

      - name: Assert outputs
        env:
          RO_EXIT: ${{ steps.report_only.outputs.exit-code }}
          RO_PAGES: ${{ steps.report_only.outputs.pages }}
          RO_BROKEN: ${{ steps.report_only.outputs.broken-links }}
          RO_TITLES: ${{ steps.report_only.outputs.missing-titles }}
          G_EXIT: ${{ steps.gated.outputs.exit-code }}
          G_OUTCOME: ${{ steps.gated.outcome }}
          REPORT: ${{ steps.report_only.outputs.report-path }}
        run: |
          set -x
          test "$RO_EXIT" = "0"
          test "$RO_PAGES" = "3"          # home, about, missing (404) — private/ is robots-blocked
          test "$RO_BROKEN" = "2"         # the link to /missing.html + the 404 page itself
          test "$RO_TITLES" = "0"         # python http.server's 404 page does carry a <title>
          test "$G_EXIT" = "1"
          test "$G_OUTCOME" = "failure"
          python3 -c "import json,sys; r=json.load(open('$REPORT')); assert r['robotsBlocked']==['http://127.0.0.1:8080/private/secret.html'], r['robotsBlocked']; print('robotsBlocked ok')"
